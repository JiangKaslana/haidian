name: people-first-final-selfcheck-diagnosis

on:
  push:
    branches:
      - agent/people-first-jingzhang-ci-v2

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact release branch
        uses: actions/checkout@v4
        with:
          ref: agent/people-first-jingzhang
          fetch-depth: 2
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /brief/
            /data/
            /sources/
            /scenarios/
            /skills/
            /submissions/JiangKaslana/jingzhang-people-ai-city/
            /tracks.json
            /requirements-review.txt

      - name: Fetch merge parents and latest fork main
        run: |
          git fetch --deepen=2 origin agent/people-first-jingzhang
          git fetch --depth=1 origin main:refs/remotes/origin/main
          git merge-base origin/main HEAD

      - name: Install review dependencies
        run: |
          python3 -m pip install --disable-pip-version-check -r requirements-review.txt
          python3 -m pip install --disable-pip-version-check --quiet 'jsonschema==4.25.1'

      - name: Run exact current self-check without mutation
        run: |
          python3 scripts/self_check_submission.py \
            submissions/JiangKaslana/jingzhang-people-ai-city \
            --pr-author JiangKaslana \
            --json
